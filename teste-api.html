<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste API Transferegov</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      margin: 0;
      padding: 40px 20px;
      color: #172033;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    button {
      background: #111827;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #263247;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #eef2f7;
      font-weight: bold;
    }

    pre {
      margin-top: 20px;
      padding: 20px;
      background: #111827;
      color: #d1fae5;
      border-radius: 10px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 500px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Teste da API Transferegov</h1>

  <p>
    Este teste verifica se o GitHub Pages consegue consultar
    diretamente a API pública de TEDs do Transferegov.
  </p>

  <p>
    Consulta utilizada:
    <strong>UFLA — Universidade Federal de Lavras</strong>
  </p>

  <button onclick="testarAPI()">
    Testar API Transferegov
  </button>

  <div id="status">
    Aguardando teste.
  </div>

  <pre id="resultado"></pre>

</div>

<script>

async function testarAPI() {

  const status = document.getElementById("status");
  const resultado = document.getElementById("resultado");

  const url =
    "https://api.transferegov.gestao.gov.br/ted/plano_acao" +
    "?sigla_unidade_descentralizada=eq.UFLA&limit=1";

  status.innerHTML = "⏳ Consultando API...";
  resultado.textContent = "";

  try {

    const resposta = await fetch(url, {
      method: "GET",
      headers: {
        "Accept": "application/json"
      }
    });

    if (!resposta.ok) {
      throw new Error(
        "HTTP " +
        resposta.status +
        " - " +
        resposta.statusText
      );
    }

    const dados = await resposta.json();

    status.innerHTML =
      "✅ SUCESSO — O GitHub Pages conseguiu acessar a API do Transferegov.";

    resultado.textContent =
      JSON.stringify(dados, null, 2);

  }

  catch (erro) {

    status.innerHTML =
      "❌ FALHA — O navegador não conseguiu acessar diretamente a API.";

    resultado.textContent =
      "Erro detectado:\n\n" +
      erro.message +
      "\n\n" +
      "Se aparecer mensagem relacionada a CORS, " +
      "a integração precisará de uma camada intermediária.";

    console.error(erro);

  }

}

</script>

</body>
</html>
